---
# MegaLinter Configuration
# https://megalinter.github.io/

# Core Configuration
APPLY_FIXES: yes
DISABLE_ERRORS: false
SHOW_ELAPSED_TIME: true
PARALLEL: true
FILEIO_REPORTER: false

DISABLE_LINTERS:
  - JSON_PRETTIER  # Disable beautifying JSON with Prettier
  - YAML_PRETTIER  # Disable beautifying YAML with Prettier

# Filter Configuration
FILTER_REGEX_EXCLUDE: (\.git|\.venv|\.pytest_cache|\.vscode|__pycache__)

# Install project + dev dependencies so PYLINT and PYRIGHT can resolve imports
# (pysrt, pytest) instead of reporting them as missing.
#
# pylint runs in its own MegaLinter venv (/venvs/pylint), so the install has
# to happen inside it. The `cd` is explicit because the `cwd` key is ignored
# when `venv` is set: pip otherwise runs in /venvs/pylint and fails with
# "does not appear to be a Python project".
#
# pyright is a Node package, not a Python venv, so there is no /venvs/pyright
# to install into. Build a plain venv for it instead and point pyright at that
# interpreter with --pythonpath.
#
# PIP_CACHE_DIR is redirected because pip's default (/github/home/.cache/pip)
# is not writable by the container user, which makes pip warn and disable
# caching entirely. /tmp is writable, so both installs share a real cache.
PRE_COMMANDS:
  - command: >-
      cd /github/workspace &&
      PIP_CACHE_DIR=/tmp/pip-cache pip install -e .[dev]
    venv: pylint
  - command: >-
      python3 -m venv /tmp/pyright-venv &&
      PIP_CACHE_DIR=/tmp/pip-cache
      /tmp/pyright-venv/bin/pip install -e "/github/workspace[dev]"
    cwd: "workspace"

# Checkov Configuration
REPOSITORY_CHECKOV_ARGUMENTS: "--skip-check CKV2_GHA_1"

# TruffleHog Configuration
# The Lob detector has a known false-positive bug: its pattern matches any
# test_-prefixed identifier 35+ chars long, which collides with pytest's
# test_ naming convention, and a 403-handling bug makes it mis-report those
# matches as "verified". Fixed upstream but not yet in a release:
# https://github.com/trufflesecurity/trufflehog/issues/5187
# This project has no relation to Lob's API, so excluding the detector costs
# nothing; remove this once a TruffleHog release includes the fix.
REPOSITORY_TRUFFLEHOG_ARGUMENTS: "--exclude-detectors=lob"

# Set the threshold for JSCPD to 5% (default is 0%) so that it does not report
COPYPASTE_JSCPD_ARGUMENTS: "--threshold 5"

# Not worried if Lychee finds dead links
SPELL_LYCHEE_DISABLE_ERRORS: true

# Exclude GitHub-relative links that only resolve correctly when rendered on
# GitHub (e.g. SECURITY.md's "../../issues/new/choose" link), since Lychee
# checks them against the local filesystem instead.
SPELL_LYCHEE_ARGUMENTS: "--exclude 'issues/new/choose'"

# JSON Configuration
# --bom               Ignore the leading UTF-8 byte-order mark
# --comments          Allow comments in JSON files
# --trailing-newline  Ensure a trailing newline at the end of JSON files
# --trailing-commas   Allow trailing commas in JSON files
JSON_JSONLINT_ARGUMENTS: "--comments --trailing-newline --trailing-commas"

# CSpell Config
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: (\.cspell\.json|\.gitignore)

# EditorConfig Checker Config
# Exclude LICENSE: it is the canonical Apache License 2.0 text copied
# verbatim from apache.org and should not be reformatted to satisfy
# indent-size rules.
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (LICENSE)

# Pyright Configuration
PYTHON_PYRIGHT_ARGUMENTS: "--pythonpath /tmp/pyright-venv/bin/python"

# Bandit Configuration
# Explicitly point at pyproject.toml's [tool.bandit] (bandit does not
# auto-discover it) so B101 (assert) is skipped for the tests/ directory,
# where assert is idiomatic pytest usage.
PYTHON_BANDIT_ARGUMENTS: "-c pyproject.toml"
